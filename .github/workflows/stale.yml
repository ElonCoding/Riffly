name: Stale Issues & PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs.'
          stale-pr-message: 'This pull request has been automatically marked as stale due to 45 days of inactivity. It will be closed in 7 days if no further activity occurs.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-stale: 60
          days-before-close: 7
          days-before-pr-stale: 45
          days-before-pr-close: 7
          exempt-issue-labels: 'pinned,security,enhancement,critical'
          exempt-pr-labels: 'pinned,work in progress,dependencies'
